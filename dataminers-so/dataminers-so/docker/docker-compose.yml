# =============================================================================
# docker-compose.yml - Servicios, redes, variables y volúmenes del proyecto
# Proyecto : DataMiners - SGRSI 2026
# Tareas   : Docker Compose · Contenedor de aplicación · Contenedor MySQL ·
#            Configurar volúmenes · Configurar red Docker
# Consigna : Docker Compose: Configurar Docker Compose para gestionar los
#            diferentes servicios, redes, variables y volúmenes del proyecto.
# Consigna : Contenedor MySQL: Configurar el contenedor de MySQL, incluyendo
#            credenciales, base de datos, persistencia y conexión con la
#            aplicación.
# Consigna : Configurar volúmenes: Configurar volúmenes Docker para garantizar
#            la persistencia de los datos necesarios, especialmente los de la
#            base de datos.
# Consigna : Configurar red Docker: Crear y configurar la red interna de Docker
#            para permitir la comunicación segura entre los diferentes
#            contenedores.
#
# Uso (desde la carpeta docker/):
#   cp .env.example .env        # y completar las contraseñas
#   docker compose up -d --build
#   docker compose ps
#   docker compose logs -f app
#   docker compose down         # (los datos se conservan en los volúmenes)
# =============================================================================

name: dataminers

services:

  # ---------------------------- Base de datos MySQL ----------------------------
  db:
    image: mysql:8.0
    container_name: dm_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Definir MYSQL_ROOT_PASSWORD en .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-dataminers}
      MYSQL_USER: ${MYSQL_USER:?Definir MYSQL_USER en .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Definir MYSQL_PASSWORD en .env}
      TZ: ${TZ:-America/Montevideo}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - db_data:/var/lib/mysql                    # persistencia de los datos
      - ./initdb:/docker-entrypoint-initdb.d:ro   # esquema inicial (solo en el primer arranque)
    networks:
      - dm_back                                   # SOLO red interna: sin acceso desde afuera
    # NO se publica el puerto 3306: la base no es accesible desde fuera de Docker
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ------------------------------- Aplicación ----------------------------------
  app:
    build:
      context: ..                                 # raíz del repositorio
      dockerfile: docker/Dockerfile
    image: dataminers/app:latest
    container_name: dm_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy                # espera a que MySQL esté listo
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db                                 # nombre del servicio = nombre DNS interno
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-dataminers}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      TZ: ${TZ:-America/Montevideo}
    ports:
      - "${APP_PUERTO:-80}:3000"                  # puerto del servidor -> puerto de la app
    volumes:
      - app_logs:/app/logs
    networks:
      - dm_front                                  # red con salida/entrada hacia el servidor
      - dm_back                                   # red interna para hablar con MySQL
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

# --------------------------------- Redes -----------------------------------------
networks:
  dm_front:
    name: dm_front
    driver: bridge
  dm_back:
    name: dm_back
    driver: bridge
    internal: true                                # sin acceso a Internet ni al exterior

# -------------------------------- Volúmenes --------------------------------------
volumes:
  db_data:
    name: dm_db_data                              # datos de MySQL (lo más importante)
  app_logs:
    name: dm_app_logs                             # logs de la aplicación
